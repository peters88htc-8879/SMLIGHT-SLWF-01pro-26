name: Build ESPHome Firmware
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ESPHome binary
        run: |
          docker run --rm -v "${PWD}":/config esphome/esphome compile smlight.yaml

      - name: Copy firmware
        run: |
          mkdir -p output
          find .esphome/ -name "*.bin" -exec cp {} output/firmware.bin \; || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: output/firmware.bin
